# ============================================================
# APEX — Automated Pipeline for Elastic eXecution
# CI/CD Pipeline for Portfolio Website (GitHub Actions)
# ============================================================
# This pipeline automatically:
#   1. Triggers on every push to the 'main' branch
#   2. Installs Node.js dependencies
#   3. Runs automated tests
#   4. Builds the React production bundle
#   5. Deploys to Azure App Service via Kudu Zip Deploy
# ============================================================

name: 'APEX CI/CD Pipeline'

on:
  push:
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: kaviarasan-portfolio-apex
  NODE_VERSION: '20.x'

jobs:
  # ========================================
  # JOB 1: CONTINUOUS INTEGRATION (CI)
  # Build & Test the React Application
  # ========================================
  build:
    name: '🔨 Build & Test'
    runs-on: ubuntu-latest

    steps:
      - name: '📥 Checkout Code'
        uses: actions/checkout@v4

      - name: '📦 Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: '📥 Install Dependencies'
        run: npm ci

      - name: '🧪 Run Tests'
        run: npm test -- --ci --watchAll=false --passWithNoTests
        continue-on-error: true

      - name: '🏗️ Build Production Bundle'
        run: npm run build

      - name: '📤 Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build/

  # ========================================
  # JOB 2: CONTINUOUS DEPLOYMENT (CD)
  # Deploy to Azure App Service via Kudu API
  # ========================================
  deploy:
    name: '🚀 Deploy to Azure'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: '📥 Download Artifact'
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: build/

      - name: '📦 Create Deployment Package'
        run: |
          cd build
          zip -r ../deploy.zip .
          cd ..
          echo "📦 Package size: $(du -h deploy.zip | cut -f1)"

      - name: '🌐 Deploy to Azure App Service (Kudu Zip Deploy)'
        env:
          DEPLOY_CREDS: ${{ secrets.DEPLOY_CREDENTIALS }}
        run: |
          echo "🚀 Deploying to Azure App Service..."
          curl -X POST \
            -H "Authorization: Basic ${DEPLOY_CREDS}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @deploy.zip \
            "https://${{ env.AZURE_WEBAPP_NAME }}.scm.azurewebsites.net/api/zipdeploy" \
            --fail \
            --silent \
            --show-error \
            -o /dev/null \
            -w "HTTP Status: %{http_code}\n"
          echo "✅ Deployment complete!"

      - name: '✅ Deployment Summary'
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **App**: ${{ env.AZURE_WEBAPP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Method**: Kudu Zip Deploy API" >> $GITHUB_STEP_SUMMARY
