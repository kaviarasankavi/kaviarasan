# ============================================================
# APEX — Automated Pipeline for Elastic eXecution
# CI/CD Pipeline for Portfolio Website (GitHub Actions)
# ============================================================
# This pipeline automatically:
#   1. Triggers on every push to the 'main' branch
#   2. Installs Node.js dependencies
#   3. Runs automated tests
#   4. Builds the React production bundle
#   5. Deploys to Azure App Service
# ============================================================

name: 'APEX CI/CD Pipeline'

on:
  push:
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: kaviarasan-portfolio-apex
  NODE_VERSION: '20.x'

jobs:
  # ========================================
  # JOB 1: CONTINUOUS INTEGRATION (CI)
  # Build & Test the React Application
  # ========================================
  build:
    name: '🔨 Build & Test'
    runs-on: ubuntu-latest

    steps:
      - name: '📥 Checkout Code'
        uses: actions/checkout@v4

      - name: '📦 Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: '📥 Install Dependencies'
        run: npm ci

      - name: '🧪 Run Tests'
        run: npm test -- --ci --watchAll=false --passWithNoTests
        continue-on-error: true

      - name: '🏗️ Build Production Bundle'
        run: npm run build

      - name: '📤 Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build/

  # ========================================
  # JOB 2: CONTINUOUS DEPLOYMENT (CD)
  # Deploy to Azure App Service
  # ========================================
  deploy:
    name: '🚀 Deploy to Azure'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: '📥 Download Artifact'
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: build/

      - name: '🌐 Deploy to Azure App Service'
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: build/

      - name: '✅ Deployment Summary'
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **App**: ${{ env.AZURE_WEBAPP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
